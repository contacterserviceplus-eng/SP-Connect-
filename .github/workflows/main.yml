name: Construire SP Connect

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Compilation Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Vérifier les fichiers
        run: |
          echo "Contenu du projet :"
          ls -la
          echo "Recherche de gradlew :"
          find . -name gradlew -type f

      - name: Donner les permissions à Gradle
        run: chmod +x gradlew

      - name: Construire l'application
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: SP-Connect-debug
          path: "**/build/outputs/apk/debug/*.apk"
